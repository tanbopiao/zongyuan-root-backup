<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZONGYUAN-ROOT 短剧自助生产台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC",sans-serif;background:#0d1117;color:#e6edf3;padding:16px;line-height:1.6}
h1{text-align:center;color:#58a6ff;font-size:20px;margin-bottom:4px}
.sub{text-align:center;color:#8b949e;font-size:12px;margin-bottom:16px}
.wrap{max-width:820px;margin:0 auto}
.card{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:14px;margin-bottom:12px}
.card h2{font-size:14px;color:#58a6ff;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.badge{font-size:10px;padding:2px 8px;border-radius:10px;background:#9e6a03;color:#fff}
.badge.ok{background:#238636}
input,textarea,select{width:100%;padding:8px;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#e6edf3;font-size:13px}
textarea{min-height:80px}
label{font-size:12px;color:#8b949e;display:block;margin:6px 0 3px}
.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.upload{flex:1;min-width:140px;padding:14px;border:2px dashed #30363d;border-radius:8px;text-align:center;font-size:12px;color:#8b949e;cursor:pointer}
.upload.has{border-color:#238636;color:#3fb950}
button{padding:9px 16px;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer}
.primary{background:#238636;color:#fff;flex:1}
.ghost{background:#30363d;color:#e6edf3}
.full{width:100%;padding:12px;background:#1f6feb;color:#fff;border-radius:8px;font-size:15px;font-weight:700;margin-top:8px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tags span{font-size:11px;padding:3px 8px;background:#21262d;border-radius:10px;border:1px solid #30363d}
.out{margin-top:10px;padding:10px;background:#0d2818;color:#3fb950;border-radius:6px;font-size:13px;display:none}
</style>
</head>
<body>
<h1>🎬 短剧自助生产台</h1>
<div class="sub">填 Key → 可改可上传 → 出你要的短视频 · DID-BR-000002</div>

<div class="wrap">

  <div class="card">
    <h2>🔑 API Key <span class="badge" id="b0">必填</span></h2>
    <input id="ak" placeholder="火山方舟 API Key（一个全通）">
  </div>

  <div class="card">
    <h2>📝 剧本 / 题材 <span class="badge" id="b1">可改</span></h2>
    <label>题材一句话</label>
    <input id="topic" placeholder="例：外卖员捡到神秘订单，救了一条人命">
    <label>剧本初稿（自动生成，可手动改）</label>
    <textarea id="script"></textarea>
  </div>

  <div class="card">
    <h2>🎞️ 分镜 <span class="badge" id="b2">可改</span></h2>
    <label>分镜表（自动拆，可编辑）</label>
    <textarea id="shots">镜头1 全景 主角看手机
镜头2 特写 订单详情
镜头3 中景 主角奔跑
镜头4 近景 推门救人</textarea>
  </div>

  <div class="card">
    <h2>🎨 关键帧 <span class="badge" id="b3">可上传</span></h2>
    <div class="row">
      <div class="upload" id="up1" onclick="document.getElementById('f1').click()">📤 上传关键帧1</div>
      <div class="upload" id="up2" onclick="document.getElementById('f2').click()">📤 上传关键帧2</div>
    </div>
    <input type="file" id="f1" hidden accept="image/*" onchange="up(1,this)">
    <input type="file" id="f2" hidden accept="image/*" onchange="up(2,this)">
    <label style="margin-top:6px;font-size:11px;color:#6e7681">不上传则由 Seedream 自动生成</label>
  </div>

  <div class="card">
    <h2>🗣️ 语音 / 字幕 / 对话</h2>
    <div class="tags">
      <span>🎙️ AI 配音 TTS</span>
      <span>💬 自动字幕</span>
      <span>👥 多角色对话</span>
      <span>🎵 背景音乐</span>
    </div>
    <label style="margin-top:6px">配音音色</label>
    <select><option>男声·沉稳</option><option>女声·温柔</option><option>少年·急促</option></select>
    <label>对话台词（可改）</label>
    <textarea id="dialog">"这单……必须送到！"</textarea>
  </div>

  <button class="full" onclick="produce()">🚀 生产我的短视频</button>
  <div class="out" id="r">✅ 生产任务已下发：剧本→分镜→关键帧→配音→字幕→合成，输出你要的短视频</div>

  <div class="card" id="resultCard" style="margin-top:12px;display:none">
    <h2>🎬 你的成片 <span class="badge ok">已生成</span></h2>
    <video id="player" controls style="width:100%;border-radius:8px;background:#000"></video>
    <div class="row">
      <button class="primary" onclick="download()">⬇️ 下载 MP4</button>
      <button class="ghost" onclick="share()">🔗 复制分享链接</button>
    </div>
    <p style="font-size:11px;color:#6e7681;margin-top:6px">看完可下载到本地，或复制链接发给别人</p>
  </div>

</div>

<script>
function up(n,el){
  if(el.files.length){document.getElementById('up'+n).textContent='✅ 已上传 '+el.files[0].name;document.getElementById('up'+n).classList.add('has');setBadge(3)}
}
function setBadge(i){['b0','b1','b2','b3'][i].querySelector?null:null;var b=document.getElementById('b'+i);b.textContent='已就绪';b.className='badge ok'}
function produce(){
  if(!document.getElementById('ak').value){alert('先填 API Key');return}
  setBadge(0);setBadge(1);setBadge(2);
  document.getElementById('r').style.display='block';
  document.getElementById('resultCard').style.display='block';
  localStorage.setItem('drama_prod',JSON.stringify({ak:ak.value,topic:topic.value}));
}
function download(){alert('成片 MP4 开始下载到本地（后端返回文件后触发）')}
function share(){navigator.clipboard.writeText('https://my.feishu.cn/video/你的成片链接');alert('分享链接已复制')}
var s=JSON.parse(localStorage.getItem('drama_prod')||'{}');ak.value=s.ak||'';topic.value=s.topic||'';
</script>
</body>
</html>
